name: Preprocessing Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    name: Run Preprocessing Pipeline
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      # 3. Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn

      # 4. Jalankan skrip preprocessing
      - name: Run Preprocessing Script
        run: python automate_Akram-Alfadli-Tamir.py

      # 5. Upload hasil preprocessing sebagai artifact
      - name: Upload Preprocessed Data
        uses: actions/upload-artifact@v4
        with:
          name: preprocessed-dataset
          path: |
            train_data.csv
            test_data.csv
          retention-days: 30
